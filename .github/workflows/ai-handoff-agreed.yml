name: ai-handoff-agreed
# AI 가 다른 파트에 넘긴 이슈(ai→be·ai→fe·contract 라벨)에 `합의됨` 라벨이 붙거나 이슈가 닫히면,
# 그 이슈를 "선행 이슈"로 적어 둔 열린 AI 요청 이슈를 찾아 팀 디스코드에 "AI 후속 작업 시작 가능"을 알린다.
# 하네스(mm-harness ai-feature)는 사용자 컴퓨터의 세션에서 돌아 웹훅이 직접 깨울 수 없어서, 사람이 이 알림을 보고 다시 시작한다.
#
# concurrency 를 넣지 않는다. 대기하던 실행이 취소되면 그 알림은 사라진다(team-notify 와 같은 이유).

on:
  issues:
    types: [labeled, closed]

permissions:
  issues: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 1차 거름: 넘긴 이슈가 아니면 러너를 띄우지 않는다. labeled 는 `합의됨` 이 붙을 때만
    if: >-
      (contains(github.event.issue.labels.*.name, 'ai→be') ||
       contains(github.event.issue.labels.*.name, 'ai→fe') ||
       contains(github.event.issue.labels.*.name, 'contract')) &&
      (github.event.action == 'closed' || github.event.label.name == '합의됨')
    steps:
      - name: Find waiting AI requests and notify
        shell: python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_TEAM }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          URL: ${{ github.event.issue.html_url }}
          ACTION: ${{ github.event.action }}
        run: |
          import json
          import os
          import re
          import subprocess
          import sys
          import urllib.request

          number = os.environ["NUMBER"]
          repo = os.environ["REPO"]

          # "## 선행 이슈" 절에 이 번호가 적힌 열린 이슈를 찾는다
          out = subprocess.run(
              ["gh", "issue", "list", "-R", repo, "--state", "open", "--limit", "100",
               "--search", f"\"#{number}\" in:body", "--json", "number,title,url,body"],
              check=True, capture_output=True, text=True).stdout
          waiting = []
          for issue in json.loads(out):
              m = re.search(r"^##\s*선행 이슈\s*$(.*?)(?=^##\s|\Z)", issue["body"] or "", re.M | re.S)
              if m and re.search(rf"#{number}(?!\d)", m.group(1)):
                  waiting.append(issue)
          if not waiting:
              print("이 이슈를 선행으로 둔 열린 AI 요청이 없다")
              sys.exit(0)

          # 그 요청의 다른 선행 이슈도 모두 풀렸는지 본다
          def done(n):
              v = json.loads(subprocess.run(["gh", "issue", "view", n, "-R", repo, "--json", "state,labels"],
                                            check=True, capture_output=True, text=True).stdout)
              return v["state"] == "CLOSED" or any(l["name"] == "합의됨" for l in v["labels"])

          how = "합의됨" if os.environ["ACTION"] == "labeled" else "닫힘"
          lines = [f"🤝 #{number} {os.environ['TITLE']} ({how}) {os.environ['URL']}"]
          for w in waiting:
              sec = re.search(r"^##\s*선행 이슈\s*$(.*?)(?=^##\s|\Z)", w["body"], re.M | re.S).group(1)
              pending = [n for n in dict.fromkeys(re.findall(r"#(\d+)", sec)) if n != number and not done(n)]
              if pending:
                  lines.append(f"  ⏳ #{w['number']} {w['title']}: 남은 선행 이슈 " + ", ".join(f"#{n}" for n in pending))
              else:
                  lines.append(f"  ▶️ #{w['number']} {w['title']}: 시작 가능 → `/mm-harness:ai-feature #{w['number']}`")

          url = os.environ.get("DISCORD_WEBHOOK")
          if not url:
              print("\n".join(lines))
              print("DISCORD_WEBHOOK_TEAM 이 없어 보내지 않았다")
              sys.exit(0)
          payload = {"content": "\n".join(lines)[:1900], "username": "Manager's Manager", "flags": 4,
                     "allowed_mentions": {"parse": []}}
          req = urllib.request.Request(url, data=json.dumps(payload).encode("utf-8"), method="POST",
                                       headers={"Content-Type": "application/json",
                                                "User-Agent": "ktc4-kyungpook-3-ai-handoff-agreed"})
          with urllib.request.urlopen(req, timeout=15):
              pass
