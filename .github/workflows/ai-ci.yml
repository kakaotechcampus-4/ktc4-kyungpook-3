name: ai-ci

on:
  pull_request:
    branches: [develop]
    paths:
      - 'ai/**'
      # ai/tests/deploy 가 배포 스크립트를 돌려 본다
      - 'deploy/ec2-deploy.sh'
      - '.github/workflows/ai-ci.yml'
  # deploy.yml 이 배포 전에 같은 커밋으로 부른다
  workflow_call:

defaults:
  run:
    working-directory: ai

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps (py-cord voice)
        run: sudo apt-get update && sudo apt-get install -y libopus0
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.13.7"
      - run: uv venv --python 3.12 .venv
      - run: uv pip install --python .venv/bin/python -r requirements.txt
      - run: .venv/bin/python -m pytest
