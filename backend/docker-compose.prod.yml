# 운영용 구성 (EC2 한 대에 DB와 API를 같이 띄운다). 로컬 개발은 docker-compose.yml을 쓴다.
#   docker compose -f docker-compose.prod.yml up -d --build
# 값은 같은 폴더의 .env에서 읽는다. .env.example의 운영 항목을 채워 둔다.
name: mm-prod

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER를 .env에 설정하세요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB를 .env에 설정하세요}
    # 호스트에 포트를 열지 않는다. api만 compose 네트워크 안에서 db:5432로 접근한다.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build: .
    image: mm-backend
    # NOTION_*, EMBEDDING_*, SERVICE_TOKEN 등은 .env에서 그대로 넘긴다.
    env_file: .env
    environment:
      # .env의 DATABASE_URL(로컬용 localhost)보다 우선한다.
      # 비밀번호에 @ : / 같은 문자가 있으면 URL이 깨지므로 영숫자로 정한다.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Notion OAuth state 서명 키. 빠뜨리면 배포 단계에서 멈춘다(빈 키로는 연결을 시작할 수 없다).
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:?OAUTH_STATE_SECRET를 .env에 설정하세요}
      # 포트를 127.0.0.1에만 열어서 같은 서버의 리버스 프록시만 붙을 수 있다. 그래서 전달 헤더를 모두 믿는다.
      FORWARDED_ALLOW_IPS: "*"
      # 웹 업로드 녹음. 아래 uploads 볼륨이라 재배포해도 남는다
      UPLOAD_DIR: /data/uploads
      # 회의 녹음 저장소(#659). 기본은 local(위 볼륨)이고, 운영은 .env 의 UPLOAD_STORAGE=s3 로 바꾼다.
      # 운영 버킷은 개인 AWS 계정이라 전용 IAM 사용자 키(AWS_ACCESS_KEY_ID·AWS_SECRET_ACCESS_KEY)를 .env 에 둔다.
      # 위 env_file 로 그대로 넘어가 boto3 기본 체인이 읽는다(deploy/README.md 의 "회의 녹음 S3 준비").
      UPLOAD_STORAGE: ${UPLOAD_STORAGE:-local}
      UPLOAD_S3_BUCKET: ${UPLOAD_S3_BUCKET:-}
      UPLOAD_S3_PREFIX: ${UPLOAD_S3_PREFIX:-meetings/}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      UPLOAD_AUDIO_RETENTION_DAYS: ${UPLOAD_AUDIO_RETENTION_DAYS:-7}
      UPLOAD_PLAYBACK_URL_TTL_SECONDS: ${UPLOAD_PLAYBACK_URL_TTL_SECONDS:-3600}
    volumes:
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  uploads:
