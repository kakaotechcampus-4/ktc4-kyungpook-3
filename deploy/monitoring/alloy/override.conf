# /etc/systemd/system/alloy.service.d/override.conf
# Alloy 를 root 로 돌린다. 패키지 기본(alloy 사용자)으로는 cadvisor 의 docker 수집이 containerd 소켓
# (/run/containerd/containerd.sock, root 전용)을 못 열어 api·db 컨테이너 지표가 빈다(2026-11-11 설치에서 확인).
# 처음 설계는 docker 그룹만 주는 것이었는데, docker 그룹도 root 와 같은 권한이라 보안 차이는 거의 없다.
# Alloy 를 신뢰할 수 없게 되면(공급망·설정 오류) 서버 전체가 위험하다.
[Service]
User=root
EnvironmentFile=/etc/mm-monitoring/alloy.env
MemoryMax=200M
