# /etc/systemd/system/alloy.service.d/override.conf
# SupplementaryGroups=docker 는 root 와 같은 권한을 준다. docker 소켓으로 컨테이너를 만들고 호스트 파일을 마운트할 수 있다.
# 컨테이너 이름 라벨을 읽으려고 부여한다. Alloy 를 신뢰할 수 없게 되면(공급망·설정 오류) 서버 전체가 위험하다.
[Service]
EnvironmentFile=/etc/mm-monitoring/alloy.env
SupplementaryGroups=docker
MemoryMax=200M
