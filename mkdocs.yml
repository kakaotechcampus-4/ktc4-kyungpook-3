# 문서 포털 설정 (MkDocs Material). 미리보기: pip install mkdocs-material && mkdocs serve
# 배포 워크플로(GitHub Pages)와 OpenAPI → ReDoc 정적 페이지는 후속 작업 (#609).
site_name: Manager's Manager 문서
repo_url: https://github.com/kakaotechcampus-4/ktc4-kyungpook-3
docs_dir: docs
exclude_docs: |
  /README.md
  /policy/README.md
theme:
  name: material
  language: ko
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
plugins:
  - search
markdown_extensions:
  - admonition
  - tables
  - toc:
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - 홈: index.md
  - 사용자 가이드:
      - 시작하기: user/getting-started.md
      - 처음 쓰는 분을 위한 안내: user/quick-guide.md
      - 회의 기록하기: user/record-meeting.md
      - 결과 확인과 승인: user/review-approve.md
      - 회의 뒤 관리: user/follow-up.md
      - 팀원용 안내: user/for-members.md
      - 자주 묻는 질문: user/faq.md
  - 개발자 가이드:
      - 로컬 실행: dev/local-setup.md
      - 환경 변수: dev/env.md
      - 테스트: dev/testing.md
      - CI/CD와 배포: dev/deploy.md
  - 테크스펙:
      - 요약: techspec/index.md
      - 아키텍처 설계: techspec/architecture.md
      - 에이전트 설계: techspec/agent-design.md
      - 시나리오: techspec/scenarios.md
      - 요구사항·리스크: techspec/requirements-risks.md
      - 테스트 전략: techspec/test-strategy.md
      - 추가 지표: techspec/metrics.md
      - 인터페이스 명세: techspec/interface.md
  - 설계 심화:
      - 개요: design/index.md
      - AI:
          - 개요: design/ai/index.md
          - 판단 파이프라인: design/ai/judge-pipeline.md
          - 근거 검증 (Jev): design/ai/evidence-check.md
          - 전사 오인식 검사: design/ai/asr-check.md
          - 답장 판단: design/ai/reply-judgment.md
          - 전사 (STT): design/ai/stt.md
      - Backend:
          - 개요: design/backend/index.md
          - 매칭과 게이트: design/backend/gate-matching.md
          - 승인과 충돌: design/backend/approval-conflict.md
          - Notion 동기화: design/backend/notion-sync.md
          - 재촉 스케줄러: design/backend/reminder-scheduler.md
          - 보안: design/backend/security.md
      - Frontend:
          - 개요: design/frontend/index.md
          - 테크스펙: design/frontend/techspec.md
          - 프론트엔드 구조: design/frontend/structure.md
          - 주요 문제 해결 사례: design/frontend/troubleshooting.md
          - 대안 비교와 결정: design/frontend/tradeoffs-decisions.md
          - 성능 개선: design/frontend/performance.md
          - 검증 범위와 발표 데모: design/frontend/verification.md
      - 보안 점검 (2026-11-11): design/security-audit.md
          - 계약 먼저, MSW 먼저: design/frontend/contract-first-msw.md
          - AI 결과 보여 주기: design/frontend/ai-result-ui.md
          - 실시간 메시지: design/frontend/realtime-messages.md
          - 접근성과 성능: design/frontend/a11y-performance.md
  - 협업 문서:
      - 개요: collab/index.md
      - 그라운드룰: collab/ground-rules.md
      - AI 에이전트 규칙: collab/ai-agent-rules.md
      - 브랜치 전략: collab/branch-strategy.md
      - 코딩 컨벤션: collab/conventions.md
      - 코드 리뷰 기록: collab/code-reviews.md
  - API 문서: api/index.md
