    <!--
      로딩 스플래시 (#430). JS 보다 먼저 그려야 해서 여기에 둔다. React 는 같은 클래스로 같은 자리를 이어받는다(src/app/splash).
      등장 지연(300ms·600ms)은 splashMachine.ts 의 REVEAL_MS 와 짝이다.
      설치한 앱(standalone)은 시작 이미지가 같은 그림이라 등장 없이 처음부터 보인다.
    -->
    <style>
      @font-face {
        font-family: 'NanumSquare';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/src/shared/styles/fonts/NanumSquare-Bold.woff2') format('woff2');
      }
      .splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #ffffff;
        color: #171717;
      }
      .splash[data-phase='leave'] {
        pointer-events: none;
        animation: splash-out 0.4s ease forwards;
      }
      .splash__group {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      /* 0.3초 안에 준비됐고 확인(0.1초)만 남았다. 등장 시각이 지나도 보이지 않은 채 걷힌다 */
      .splash[data-settling] .splash__group {
        visibility: hidden;
      }
      .splash__mascot {
        width: 176px;
        height: 176px;
        animation: splash-rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1)
          calc(300ms - var(--splash-shift, 0ms)) both;
      }
      .splash__word {
        margin: 0;
        font:
          700 24px/1.2 'NanumSquare',
          sans-serif;
        animation: splash-follow 0.8s cubic-bezier(0.2, 0.7, 0.2, 1)
          calc(600ms - var(--splash-shift, 0ms)) both;
      }
      .splash__status {
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(32px + env(safe-area-inset-bottom));
        margin: 0;
        text-align: center;
        font:
          400 13px/1.4 'NanumSquare',
          sans-serif;
        color: #525252;
      }
      #boot-splash [data-part='dial-shift'] {
        animation: splash-dial 1.818s linear infinite;
      }
      /* 올라오는 거리는 크기에 비례한다(마스코트 높이의 1/8, 워드마크 글자 크기의 1/3). 크기를 바꾸면 함께 바꾼다 (#472) */
      @keyframes splash-rise {
        from {
          opacity: 0;
          transform: translateY(22px) scale(0.9);
        }
      }
      @keyframes splash-follow {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      @keyframes splash-out {
        to {
          opacity: 0;
        }
      }
      /* 줄무늬 한 칸(0.1153 × 84)을 0.55Hz 로. Mascot 의 dialHz 0.55 와 같은 속도다 */
      @keyframes splash-dial {
        to {
          transform: translateX(9.6852px);
        }
      }
      @media (display-mode: standalone) {
        .splash__mascot,
        .splash__word {
          animation: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash__mascot,
        .splash__word {
          animation-duration: 0s;
          animation-delay: calc(300ms - var(--splash-shift, 0ms));
        }
        #boot-splash [data-part='dial-shift'] {
          animation: none;
        }
        .splash[data-phase='leave'] {
          animation: none;
          opacity: 0;
        }
      }
    </style>
