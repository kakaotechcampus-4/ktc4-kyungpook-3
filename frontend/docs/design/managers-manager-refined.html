    @media (max-width: 1100px) { .mm-screen-list { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

ius: 24px; background: #FAFAFA;\">\n        \u003cdiv style=\"display: flex; flex-direction: column; gap: 10px;\">\n          \u003cdiv style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\u003ch3 style=\"margin: 0; font-size: 16px; line-height: 26px; font-weight: 600; color: #171717\">마감 리마인드\u003c/h3>\u003c/div>\n          \u003cp style=\"margin: 0; font-size: 14px; line-height: 22px; color: #666666;\">마감 하루 전에 담당자에게 Discord DM이 갑니다. 문구는 보내기 전에 고칠 수 있어요.\u003c/p>\n        \u003c/div>\n        \u003cdiv style=\"display: flex; flex-direction: column; gap: 10px; min-height: 168px; padding: 16px; border: 1px solid #E8E8E8; border-radius: 16px; background: #FFFFFF;\">\n          \u003cspan style=\"font-size: 11.5px; color: #666666;\">Discord DM · 재환 · 09/16 09:00 예정\u003c/span>\n          \u003cp style=\"margin: 4px 0 0; padding: 11px 14px; border-radius: 16px; background: #F0F0F0; font-size: 13px; line-height: 20px; color: #171717;\">재환님, API 명세서 마감이 다음 주 목요일이에요 🙂 막히는 부분 있으면 알려주세요.\u003c/p>\n          \u003cdiv style=\"display: flex; align-items: center; gap: 8px; margin-top: auto; justify-content: flex-start; flex-direction: row-reverse\">\u003cbutton type=\"button\" style=\"height: 32px; padding: 0 14px; border: 0; border-radius: 9999px; background: #171717; font-size: 13px; font-weight: 600; color: #FFFFFF; line-height: 1\">이대로 발송\u003c/button>\u003cbutton type=\"button\" style=\"height: 32px; padding: 0 12px; border: 0; background: transparent; font-size: 13px; color: #666666; line-height: 1; font-weight: 600\">고쳐 쓰기\u003c/button>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv style=\"display: flex; flex-direction: column; gap: 20px; padding: 28px; border-radius: 24px; background: #FAFAFA;\">\n        \u003cdiv style=\"display: flex; flex-direction: column; gap: 10px;\">\n          \u003cdiv style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\u003ch3 style=\"margin: 0; 회의를 기다립니다\u003c/h3>\n          \u003cp style=\"margin: 0; max-width: 460px; font-size: 16px; line-height: 26px; color: #666666;\">랜딩과 대시보드의 기본 포즈예요. 고개는 고정하고 2.5–4초에 한 번 깜빡입니다. 커서를 따라다니지 않아요 — 포즈는 제품의 상태로만 바뀝니다.\u003c/p>\n          \u003cspan class=\"mono\" style=\"padding-top: 6px; font-size: 12.5px; color: #666666;\">idle · 눈 두 개가 크기·높이·간격까지 완전 대칭\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"pose-pane\" id=\"pane-pose-left\" style=\"flex-direction: column; gap: 14px;\">\n          \u003ch3 style=\"margin: 0; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.4px; color: #171717;\">녹음을 듣고 정리합니다\u003c/h3>\n          \u003cp style=\"margin: 0; max-width: 460px; font-size: 16px; line-height: 26px; color: #666666;\">전사하고 발화자를 나누고, 결정된 것과 담당자와 마감을 골라냅니다. 확실한 건 묻지 않고 바로 Notion에 올려요.\u003c/p>\n          \u003cspan class=\"mono\" style=\"padding-top: 6px; font-size: 12.5px; color: #666666;\">left · 흰 얼굴을 왼쪽으로 밀어 오른쪽에 초승달\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"pose-pane\" id=\"pane-pose-ask\" style=\"flex-direction: column; gap: 14px;\">\n          \u003ch3 style=\"margin: 0; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.4px; color: #171717;\">확신하지 못한 것만 묻습니다\u003c/h3>\n          \u003cp style=\"margin: 0; max-width: 460px; font-size: 16px; line-height: 26px; color: #666666;\">담당자가 둘로 갈렸거나 마감이 \"다음 주쯤\"으로만 나온 것. 이런 것만 승인 목록에 올려 두고 기다립니다.\u003c/p>\n          \u003cspan class=\"mono\" style=\"padding-top: 6px; font-size: 12.5px; color: #666666;\">upRight · 고개는 그대로, 눈만 올려 기울임\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"pose-pane\" id=\"pane-pose-done\" style=\"flex-direction: column; gap: 14px;\">\n          \u003ch3 style=\"margin: 0; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.4px; color: #171717;\">확인이 끝나면 눈을 접습니다\u003c/h3>\n          \u003cp style=\"margin: 0; max-width: 460px; font-size: 16px; line-height: 26px; color: #666666;\">승인한 것만 Notion 45em; color: #171717;\">흰 바탕, 회색은 컨트롤에만\u003c/h1>\n      \u003cp style=\"margin: 0; max-width: 660px; font-size: 14.5px; line-height: 1.8; color: #5A5A5A;\">콘텐츠가 앉는 면은 전부 흰색이고 경계는 1px 헤어라인이 긋습니다. 회색 면은 \u003cstrong style=\"font-weight: 700; color: #171717;\">누를 수 있거나 상태를 말하는 것\u003c/strong>에만 씁니다 — 버튼·배지·선택된 행. 유채색은 경고와 강조 딱 하나뿐입니다.\u003c/p>\n      \u003cp style=\"margin: 2px 0 0; font-size: 12.5px; line-height: 1.7; color: #999999;\">아래 수치는 캔버스의 실제 화면 22장에서 그대로 뽑았습니다. 스펙 문서 3장(이 페이지·매스 2장)은 셈에서 뺐습니다.\u003c/p>\n    \u003c/div>\n\n    \u003csection style=\"display: flex; flex-direction: column; gap: 22px;\">\n      \u003cdiv style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-bottom: 14px; border-bottom: 1px solid #E8E8E8;\">\u003ch2 style=\"margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.025em; color: #171717;\">글자에 쓰는 회색\u003c/h2>\u003cspan style=\"font-size: 12.5px; color: #666666;\">주 4단 + 선에서 빌려 온 3단\u003c/span>\u003c/div>\n      \u003cdiv style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px;\">\u003cdiv style=\"display: flex; flex-direction: column; gap: 11px;\">\u003cdiv style=\"height: 62px; border-radius: 12px; background: #171717; border: 1px solid transparent;\">\u003c/div>\u003cdiv style=\"display: flex; flex-direction: column; gap: 3px;\">\u003cdiv style=\"display: flex; align-items: baseline; gap: 8px;\">\u003cspan style=\"font-size: 13px; font-weight: 600; color: #171717;\">먹\u003c/span>\u003cspan class=\"mono\" style=\"font-size: 11px; color: #666666;\">#171717\u003c/span>\u003c/div>\u003cspan style=\"font-size: 11.5px; line-height: 1.6; color: #666666;\">제목 · 본문 · 강조 · 주 버튼 채움\u003c/span>\u003cspan style=\"font-size: 11px; color: #999999;\">글자로 500회\u003c/span>\u003c/div>\u003c/div>\u003cdiv style=\"display: flex; flex-direction: column; gap: 11px;\">\u003cdiv style=\"height: 62px; border-radius: 12px; background: #5A5A5A; border: 1px solid transparent;\">\u003c/div>\u003cdiv style=\"display: flex; flex-direction: column; gap: 3px;\">\u003cdiv style=\"display: flex; align-items: baseline; gap: 8px;\">\u003cspan style=\"font-size: 13px; font-weight: 600; color: #171717;\">보조\u003c/span>\u003cspan class=\"mono\" style=\"font-size: 11px; color: #666666;\">#5A5A5A\u003c/span>\u003c/div>\u003cspan style=\"font-size: 11.5px; line-height: 1.6; color: #666666;\">설명문 · 카드 부제\u003c/span>\u003cspan style=\"font-size: 11px; color: #999999;\">글자로 301회\u003c/span>\u003c/div>\u003c/div>\u003cdiv style=\"display: flex; flex-direction: column; gap: 11px;\">\u003cdiv style=\"height: 62px; border-radius: 12px; background: #666666; border: 1px solid transparent;\">\u003c/div>\u003cdiv style=\"display: flex; flex-direction: column; gap: 3px;\">\u003cdiv style=\"display: flex; align-items: baseline; gap: 8px;\">\u003cspan style=\"font-size: 13px; font-weight: 600; color: #171717;\">흐림\u003c/span>\u003cspan class=\"mono\" style=\"font-size: 11px; color: #666666;\">#666666\u003c/span>\u003c/div>\u003cspan style=\"font-size: 11.5px; line-height: 1.6; color: #666666;\">메타 · 캡션 · 시각 · 날짜\u003c/span>\u003cspan style=\"font-size: 11px; color: #999999;\">글자로 347회\u003c/span>\u003c/div>\u003c/div>\u003cdiv style=\"display: flex; flex-direction: column; gap: 11px;\">\u003cdiv style=\"height: 62px; border-radius: 12px; background: #999999; border: 1px solid transparent;\">\u003c/div>\u003cdiv style=\"display: flex; flex-direction: column; gap: 3px;\">\u003cdiv style=\"display: flex; align-items: baseline; gap: 8px;\">\u003cspan style=\"font-size: 13px; font-weight: 600; color: #171717;\">미세\u003c/span>\u003cspan class=\"mono\" style=\"font-size: 11px; color: #666666;\">#999999\u003c/span>\u003c/div>\u003cspan style=\"font-size: 11.5px; line-height: 1.6; color: #666666;\">플레이스홀더 · 비활성 버튼 글자 · 스텝 표시\u003c/span>\u003cspan style=\"font-size: 11px; color: #999999;\">글자로 9회\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cp style=\"margin: 18px 0 0; font-size: 13px; line-height: 1.8; color: #5A5A5A;\">주 4단 아래로 \u003cstrong style=\"font-weight: 700; color: #171717;\">선 색 3개도 글자에 쓰입니다\u003c/strong>: \u003cspan class=\"mono\" style=\"font-size: 12.5px; color: #171717;\">#E8E8E8\u003c/span> 비활성 탭 글자 ×6 · \u003cspan class=\"mono\" style=\"font-size: 12.5px; color: #171717;\">#BDBDBD\u003c/span> 캘린더의 다른 달 날짜 ×6 · \u003cspan class=\"mono\" style=\"font-size: 12.5px; color: #171717;\">#C9C9C9\u003c/span> 온보딩 «이전» 비활성 ×3. 선 색을 글자에 빌려 쓴 자리라, 넷으로 끝난다고 적으면 문서가 화면과 어긋납니다.\u003c/p>\n    \u003c/section>\n\n    \u003csection style=\"display: flex; flex-direction: column; gap: 22px;\">\n      \u003cdiv style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-bottom: 14px; border-bottom: 1px solid #E8E8E8;\">\u003ch2 style=\"margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.025em; color: #171717;\">면과 선\u003c/h2>\u003cspan style=\"font-size: 12.5px; color: #666666;\">면 5단 · 선 5단 — 이 열 개로 모든 화면을 만듭니다\u003c/span>\u003c/div>\n      \u003cdiv style=\"display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 20px;\">\u003cdiv style=\"display: flex; flex-direction: column; gap: 11px;\">\u003cdiv style=\"height: 62px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E8E8E8;\">\u003c/div>\u003cdiv style=\"display: flex; flex-direction: column; gap: 3px;\">\u003cdiv style=\"display: flex; align-items: baseline; gap: 8px;\">\u003cspan style=\"font-size: 13px; font-weight: 600; color: #171717;\">바탕 · 카드\u003c/span>\u003cspan class=\"mono\" style=\"font-size: 11px; color: #666666;\">#FFFFFF\u003c/span>\u003c/div>\u003cspan style=\"font-size: 11.5px; line-height: 1.6; color: #666666;\">페이지와 카드가 앉는 면\u003c/span>\u003cspan style=\"font-size: 11px; color: #999999;\">면으로 210회\u003c/span>\u003c/div>\u003c/div>\u003cdiv style=\"display: flex; flex-direction: column; gap: 11px;\">\u003cdiv style=\"height: 62px; border-radius: 12px; background: #FAFAFA; border: 1px solid #E8E8E8;\">\u003c/div>\u003cdiv style=\"display: flex; flex-direction: column; gap: 3px;\">\u003cdiv style=\"display: flex; align-items: baseline; gap: 8px;\">\u003cspan style=\"font-size: 13px; font-weight: 600; color: #171717;\">눌린 면\u003c/span>\u003cspan class=\"mono\" style=\"font-size: 11px; color: #666666;\">#FAFAFA\u003c/span>\u003c/div>\u003cspan style=\"font-size: 11.5px; line-height: 1.6; color: #666666;\">인용 블록 · 패널 · 완료 카드\u003c/span>\u003cspan style=\"font-size: 11px; color: #999999;\">면으로 43회\u003c/span>\u003c/div>\u003c/div>\u003cdiv style=\"display: flex; flex-direction: column; gap: 11px;\">\u003cdiv style=\"height: 62px; border-radius: 12px; background: #F0F0F0; border: 1px solid #E8E8E8;\">\u003c/div>\u003cdiv style=\"display: flex; flex-direction: column; gap: 3px;\">\u003cdiv style=\"display: flex; align-items: baseline; gap: 8px;\">\u003cspan style=\"font-size: 13px; font-weight: 600; color: #171717;\">선택\u003c/span>\u003cspan class=\"mono\" style=\"font-size: 11px; color: #666666;\">#F0F0F0\u003c/span>\u003c/div>\u003cspan style=\"font-size: 11.5px; line-height: 1.6; color: #666666;\">선택된 행 · 활성 탭 · 세그먼트 손잡이\u003c/span>\u003cspan style=\"font-size: 11px; color: #999999;\">면으로 52회\u003c/span>\u003c/div>\u003c/div>\u003cdiv style=\"display: flex; flex-direction: column; gap: 11px;\">\u003cdiv style=\"height: 62px; border-radius: 12px; background: #EDEDED; border: 1px solid #E8E8E8;\">\u003c/div>\u003cdiv style=\"display: flex; flex-direction: column; gap: 3px;\">\u003cdiv style=\"display: flex; align-items: baseline; gap: 8px;\">\u003cspan style=\"font-size: 13px; font-weight: 600; color: #171717;\">컨트롤\u003c/span>\u003cspan class=\"mono\" style=\"font-size: 11px; color: #666666;\">#EDEDED\u003c/span>\u003c/div>\u003cspan style=\"font-size: 11.5px; line-height: 1.6; color: #666666;\">보조 버튼 · 칩 · 보류 배지\u003c/span>\u003cspan style=\"font-size: 11px; color: #999999;\">면으로 49회\u003c/span>\u003c/div>\u003c/div>\u003cdiv style=\"display: flex; flex-direction: column; gap: 11px;\">\u003cdiv style=\"height: 62px; border-radius: 12px; background: #DCDCDC; border: 1px solid #E8E8E8;\">\u003c/div>\u003cdiv style=\"display: flex; flex-direction: column; gap: 3px;\">\u003cdiv style=\"display: flex; align-items: baseline; gap: 8px;\">\u003cspan style=\"font-size: 13px; font-weight: 600; color: #171717;\">비활성 표식\u003c/span>\u003cspan class=\"mono\" style=\"font-size: 11px; color: #666666;\">#DCDCDC\u003c/span>\u003c/div>\u003cspan style=\"font-size: 11.5px; line-height: 1.6; color: #666666;\">온보딩 스텝 점 · 토글 트랙\u003c/span>\u003cspan style=\"font-size: 11px; color: #999999;\">면으로 13회\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv style=\"height: 26px;\">\u003c/div>\u003cdiv style=\"display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 20px;\">\u003cdiv style=\"display: flex; flex-direction: column; gap: 11px;\">\u003cdiv style=\"height: 62px; border-radius: 12px; background: #949494; border: 1px solid #E8E8E8;\">\u003c/div>\u003cdiv style=\"display: flex; flex-direction: column; gap: 3px;\">\u003cdiv style=\"display: flex; align-items: baseline; gap: 8px;\">\u003cspan style=\"font-size: 13px; font-weight: 600; color: #171717;\">입력 경계\u003c/span>\u003cspan class=\"mono\" style=\"font-size: 11px; color: #666666;\">#949494\u003c/span>\u003c/div>\u003cspan style=\"font-size: 11.5px; line-height: 1.6; color: #666666;\">입력칸 테두리 — 선 중 가장 진합니다\u003c/span>\u003cspan style=\"font-size: 11px; color: #999999;\">선으로 13회\u003c/span>\u003c/div>\u003c/div>\u003cdiv style=\"display: flex; flex-direction: column; gap: 11px;\">\u003cdiv style=\"height: 62px; border-radius: 12px; background: #E8E8E8; border: 1px solid #E8E8E8;\">\u003c/div>\u003cdiv style=\"display: flex; flex-direction: column; gap: 3px;\">\u003cdiv style=\"display: flex; align-items: baseline; gap: 8px;\">\u003cspan style=\"font-size: 13px; font-weight: 600; color: #171717;\">선\u003c/span>\u003cspan class=\"mono\" style=\"font-size: 11px; color: #666666;\">#E8 rid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; align-items: start;\">\u003cul style=\"margin: 0; padding-left: 19px;\">\u003cli style=\"margin: 0 0 9px; font-size: 13px; line-height: 1.75; color: #5A5A5A;\">\u003cstrong style=\"font-weight: 700; color: #171717;\">2D만\u003c/strong>. 구면 투영, 원근 스케일, 몸 회전(yaw), 스펙큘러, 드롭 섀도 없음.\u003c/li>\u003cli style=\"margin: 0 0 9px; font-size: 13px; line-height: 1.75; color: #5A5A5A;\">고개를 돌리는 건 \u003cstrong style=\"font-weight: 700; color: #171717;\">Inner의 평행이동\u003c/strong>입니다. 메쉬를 돌리지 않아요.\u003c/li>\u003cli style=\"margin: 0 0 9px; font-size: 13px; line-height: 1.75; color: #5A5A5A;\">전환은 스프링 없이 \u003cstrong style=\"font-weight: 700; color: #171717;\">지수 ease-out\u003c/strong> — 오버슈트 없음.\u003c/li>\u003cli style=\"margin: 0 0 9px; font-size: 13px; line-height: 1.75; color: #5A5A5A;\">깜빡임은 2.5–4초마다 \u003cstrong style=\"font-weight: 700; color: #171717;\">눈 높이\u003c/strong>만 접었다 폄. 가끔 두 번 연속.\u003c/li>\u003c/ul>\u003cul style=\"margin: 0; padding-left: 19px;\">\u003cli style=\"margin: 0 0 9px; font-size: 13px; line-height: 1.75; color: #5A5A5A;\">버튼 눌림: \u003cstrong style=\"font-weight: 700; color: #171717;\">몸 쪽 아랫변 고정\u003c/strong>, 윗면만 내려왔다 복귀. 5–8초마다, 클릭 시에도 1회.\u003c/li>\u003cli style=\"margin: 0 0 9px; font-size: 13px; line-height: 1.75; color: #5A5A5A;\">다이얼: \u003cstrong style=\"font-weight: 700; color: #171717;\">버튼 안 줄무늬만 스크롤\u003c/strong>. 버튼째로 돌리거나 몸을 돌리지 않습니다.\u003c/li>\u003cli style=\"margin: 0 0 9px; font-size: 13px; line-height: 1.75; color: #5A5A5A;\">말하는 중에도 입은 생기지 않습니다. 정면 포즈에 아주 작은 세로 bounce만.\u003c/li>\u003cli style=\"margin: 0 0 9px; font-size: 13px; line-height: 1.75; color: #5A5A5A;\">\u003cspan class=\"mono\">prefers-reduced-motion\u003c/span>이면 정지 프레임 — 깜빡임·눌림 없음, 줄무늬는 보이되 안 움직임.\u003c/li>\u003c/ul>\u003c/div>\n    \u003c/section>\n\n    \u003csection style=\"display: flex; flex-direction: column; gap: 22px;\">\n      \u003cdiv style=\"display: flex; align-items: baseline; justify-con 3c/rect>\u003crect x=\"133.48\" y=\"88.25\" width=\"14.78\" height=\"38.3\" rx=\"7.39\" fill=\"#171717\">\u003c/rect>\u003c/g>\u003c/g>\u003c/svg>\u003c/div>\u003cdiv style=\"display: flex; flex-direction: column; gap: 5px; padding-top: 14px; border-top: 1px solid #F0F0F0;\">\u003cdiv style=\"display: flex; align-items: baseline; gap: 8px;\">\u003cspan style=\"font-size: 13px; font-weight: 700; color: #FF6969;\">✕\u003c/span>\u003cspan style=\"font-size: 13.5px; font-weight: 700; color: #171717;\">다이얼 = 몸 전체 회전\u003c/span>\u003c/div>\u003cp style=\"margin: 0; font-size: 12.5px; line-height: 1.7; color: #5A5A5A;\">감기는 건 버튼 안 줄무늬뿐입니다. 몸이나 버튼을 돌리면 굴러가는 공이 됩니다.\u003c/p>\u003c/div>\u003c/div>\u003cdiv style=\"display: flex; flex-direction: column; gap: 16px; padding: 24px; border: 1px solid #E8E8E8; border-radius: 16px; background: #FAFAFA;\">\u003cdiv style=\"position: relative; display: flex; align-items: center; justify-content: center; height: 132px;\">\u003csvg width=\"112\" height=\"112\" viewBox=\"0 0 240 240\" fill=\"none\" role=\"img\" aria-label=\"잘못된 예 invert\">\u003cdefs>\u003cclipPath id=\"bd-invert-f\">\u003cellipse cx=\"120\" cy=\"113.91\" rx=\"65.69\" ry=\"64.01\">\u003c/ellipse>\u003c/clipPath>\u003cclipPath id=\"bd-invert-c\">\u003crect x=\"-17.41\" y=\"-9.14\" width=\"34.82\" height=\"18.28\" rx=\"5.22\" ry=\"5.22\">\u003c/rect>\u003c/clipPath>\u003c/defs>\u003cg>\u003ccircle cx=\"120\" cy=\"120\" r=\"84\" fill=\"#171717\">\u003c/circle>\u003cellipse cx=\"120\" cy=\"113.91\" rx=\"65.69\" ry=\"64.01\" fill=\"#171717\">\u003c/ellipse>\u003cg transform=\"translate(80.78 30.79) rotate(-22)\">\u003crect x=\"-17.41\" y=\"-9.14\" width=\"34.82\" height=\"18.28\" rx=\"5.22\" ry=\"5.22\" fill=\"#171717\">\u003c/rect>\u003c/g>\u003cg clip-path=\"url(#bd-invert-f)\">\u003crect x=\"91.73\" y=\"88.25\" width=\"14.78\" height=\"38.3\" rx=\"7.39\" fill=\"#FFFFFF\">\u003c/rect>\u003crect x=\"133.48\" y=\"88.25\" width=\"14.78\" height=\"38.3\" rx=\"7.39\" fill=\"#FFFFFF\">\u003c/rect>\u003c/g>\u003c/g>\u003c/svg>\u003c/div>\u003cdiv style=\"display: flex; flex-direction: column; gap: 5px; padding-top: 14px; border-top: 1px solid #F0F0F0;\">\u003cdiv style=\"display: flex; align-items: baseline; gap: 8px;\">\u003cspan style=\"font-size: 13px; font-weight: 700; color: #FF6969;\">✕\u003c/span>\u003cspan style=\"font-size: 13.5px; font-weight: 700; color: #171717;\">흰 눈 · 검은 얼굴\u003c/span>\u003c/div>\u003cp style=\"margin: 0; font-size: 12.5px; line-height: 1.7; color: #5A5A5A;\">팔레트가 반대입니다. 얼굴과 줄무늬는 언제나 흰색, 몸·눈·버튼이 잉크 하나.\u003c/p>\u003c/div>\u003c/div>\u003cdiv style=\"display: flex; flex-direction: column; gap: 16px; padding: 24px; border: 1px solid #E8E8E8; border-radius: 16px; background: #FAFAFA;\">\u003cdiv style=\"position: relative; display: flex; align-items: center; justify-content: center; height: 132px;\">\u003csvg width=\"112\" height=\"112\" viewBox=\"0 0 240 240\" fill=\"none\" role=\"img\" aria-label=\"잘못된 예 squintScale\">\u003cdefs>\u003cclipPath id=\"bd-squintScale-f\">\u003cellipse cx=\"120\" cy=\"113.91\" rx=\"65.69\" ry=\"64.01\">\u003c/ellipse>\u003c/clipPath>\u003cclipPath id=\"bd-squintScale-c\">\u003crect x=\"-17.41\" y=\"-9.14\" width=\"34.82\" height=\"18.28\" rx=\"5.22\" ry=\"5.22\">\u003c/rect>\u003c/clipPath>\u003c/defs>\u003cg>\u003ccircle cx=\"120\" cy=\"120\" r=\"84\" fill=\"#171717\">\u003c/circle>\u003cellipse cx=\"120\" cy=\"113.91\" rx=\"65.69\" ry=\"64.01\" fill=\"#FFFFFF\">\u003c/ellipse>\u003cg transform=\"translate(80.78 30.79) rotate(-22)\">\u003crect x=\"-17.41\" y=\"-9.14\" width=\"34.82\" height=\"18.28\" rx=\"5.22\" ry=\"5.22\" fill=\"#171717\">\u003c/rect>\u003c/g>\u003cg clip-path=\"url(#bd-squintScale-f)\">\u003crect x=\"91.73\" y=\"102.18\" width=\"14.78\" height=\"10.45\" rx=\"5.22\" fill=\"#171717\">\u003c/rect>\u003crect x=\"133.48\" y=\"102.18\" width=\"14.78\" height=\"10.45\" rx=\"5.22\" fill=\"#171717\">\u003c/rect>\u003c/g>\u003c/g>\u003c/svg>\u003c/div>\u003cdiv style=\"display: flex; flex-direction: column; gap: 5px; padding-top: 14px; border-top: 1px solid #F0F0F0;\">\u003cdiv style=\"display: flex; align-items: baseline; gap: 8px;\">\u003cspan style=\"font-size: 13px; font-weight: 700; color: #FF6969;\">✕\u003c/span>\u003cspan style=\"font-size: 13.5px; font-weight: 700; color: #171717;\">가늘게 = 세로 눈 누르기\u003c/span>\u003c/div>\u003cp style=\"margin: 0; font-size: 12.5px; line-height: 1.7; color: #5A5A5A;\">정면 눈을 scaleY 하면 이렇게 됩니다. 가늘게는 44×12 가로 캡슐로 다시 그립니다.\u003c/p>\u003c/div>\u003c/div>\u003cdiv style=\"display: flex; flex-direction: column; gap: 16px; padding: 24px; border: 1px solid #E8E8E8; border-radius: 16px; background: #FAFAFA;\">\u003cdiv style=\"position: relative; display: flex; align-items: center; justify-content: center; height: 132px;\">\u003csvg width=\"112\" height=\"112\" viewBox=\"0 0 240 240\" fill=\"none\" role=\"img\" aria-label=\"잘못된 예 upEqual\">\u003cdefs>\u003cclipPath id=\"bd-upEqual-f\">\u003cellipse cx=\"111.3\" cy=\"108.69\" rx=\"65.69\" ry=\"64.01\">\u003c/ellipse>\u003c/clipPath>\u003cclipPath id=\"bd-upEqual-c\">\u003crect x=\"-17.41\" y=\"-9.14\" width=\"34.82\" height=\"18.28\" rx=\"5.22\" ry=\"5.22\">\u003c/rect>\u003c/clipPath>\u003c/defs>\u003cg>\u003ccircle cx=\"120\" cy=\"120\" r=\"84\" fill=\"#171717\">\u003c/circle>\u003cellipse cx=\"111.3\" cy=\"108.69\" rx=\"65.69\" ry=\"64.01\" fill=\"#FFFFFF\">\u003c/ellipse>\u003cg transform=\"translate(109.83 23.49) rotate(-6)\">\u003crect x=\"-17.41\" y=\"-9.14\" width=\"34.82\" height=\"18.28\" rx=\"5.22\" ry=\"5.22\" fill=\"#171717\">\u003c/rect>\u003c/g>\u003cg clip-path=\"url(#bd-upEqual-f)\">\u003crect x=\"63.62\" y=\"64.05\" width=\"14.78\" height=\"38.3\" rx=\"7.39\" transform=\"rotate(10 71.01 83.2)\" fill=\"#171717\">\u003c/rect>\u003crect x=\"94.31\" y=\"69.05\" width=\"14.78\" height=\"38.3\" rx=\"7.39\" transform=\"rotate(10 101.7 88.2)\" fill=\"#171717\">\u003c/rect>\u003c/g>\u003c/g>\u003c/svg>\u003c/div>\u003cdiv style=\"display: flex; flex-direction: column; gap: 5px; padding-top: 14px; border-top: 1px solid #F0F0F0;\">\u003cdiv style=\"display: flex; align-items: baseline; gap: 8px;\">\u003cspan style=\"font-size: 13px; font-weight: 700; color: #FF6969;\">✕\u003c/span>\u003cspan style=\"font-size: 13.5px; font-weight: 700; color: #171717;\">위 포즈에서 두 눈 같은 각도·크기\u003c/span>\u003c/div>\u003cp style=\"margin: 0; font-size: 12.5px; line-height: 1.7; color: #5A5A5A;\">먼 눈이 더 작고 더 기울어야 합니다. 같으면 평면 스티커처럼 보여요.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003cdiv style=\"margin-top: 26px;\">\u003cul style=\"margin: 0; padding-left: 19px;\">\u003cli style=\"margin: 0 0 9px; font-size: 13px; line-height: 1.75; color: #5A5A5A;\">회색으로 채운 입체 구 — 이 캐릭터는 플랫 마크입니다.\u003c/li>\u003cli style=\"margin: 0 0 9px; font-size: 13px; line-height: 1.75; color: #5A5A5A;\">커서 따라가기 — 의도적으로 뺐습니다.\u003c/li>\u003cli style=\"margin: 0 0 9px; font-size: 13px; line-height: 1.75; color: #5A5A5A;\">GIF · Lottie 루프만 쓰기 — 상태 전환이 안 됩니다.\u003c/li>\u003cli style=\"margin: 0 0 9px; font-size: 13px; line-height: 1.75; color: #5A5A5A;\">위를 볼 때 Inner를 크게 올려 \u003cstrong style=\"font-weight: 700; color: #171717;\">아래에 큰 초승달\u003c/strong> 만들기.\u003c/li>\u003cli style=\"margin: 0 0 9px; font-size: 13px; line-height: 1.75; color: #5A5A5A;\">그라데이션 · 광택 · 그림자 · 입 · 눈썹. 산호 팔레트는 Figma 컬러 스터디로만.\u003c/li>\u003cli style=\"margin: 0 0 9px; font-size: 13px; line-height: 1.75; color: #5A5A5A;\">좌우 포즈를 거울로 맞추지 않기. 새 포즈는 프레임을 보간하지 말고 규칙으로 새 키를 정의합니다.\u003c/li>\u003c/ul>\u003c/div>\n    \u003c/section>\n  \u003c/div>\n\u003c/div>\n\u003c/x-dc>\n\u003c/body>\n\u003c/html>\n"}</script>
  <script>(() => {
  'use strict';

  const frame = document.querySelector('#mm-canvas');
  const layer = document.querySelector('#mm-runtime-layer');
  const sourceNode = document.querySelector('#mm-screen-sources');
  const sources = JSON.parse(sourceNode.textContent);
  const screenIds = Object.keys(sources);
  const storageKey = 'managers-manager-refined-v77';
  const defaultState = {
    teamName: '캡스톤 5조',
    teamCreated: false,
    onboarding: { discord: false, notion: false, members: false },
    forms: {},
    decisions: {},
  };

  const groups = [
    ['진입', ['Landing', 'Login', 'Signup']],
    ['온보딩', ['SetupTeam', 'SetupDiscord', 'SetupNotion', 'SetupMembers']],
    ['제품', ['Main', 'Upload', 'Processing', 'Meetings', 'Tasks', 'TasksBoard', 'TasksGantt', 'TasksCalendar', 'Messages', 'MessagesThread', 'Team', 'Settings']],
    ['빈 상태', ['EmptyMeetings', 'EmptyTasks', 'EmptyMessages']],
    ['문서', ['Foundations', 'Mascot', 'MascotUsage']],
  ];

  const labels = {
    Landing: '랜딩페이지', Login: '로그인', Signup: '회원가입',
    SetupTeam: '셋업 1 · 팀 만들기', SetupDiscord: '셋업 2 · Discord',
    SetupNotion: '셋업 3 · Notion', SetupMembers: '셋업 4 · 팀원 연결',
    Main: '대시보드', Upload: '회의 올리기', Processing: '정리 중',
    Meetings: '회의록', Tasks: '태스크 · 리스트', TasksBoard: '태스크 · 보드',
    TasksGantt: '태스크 · 간트', TasksCalendar: '태스크 · 캘린더',
    Messages: '메시지 · 승인', MessagesThread: '메시지 · 대화', Team: '팀',
    Settings: '설정', EmptyMeetings: '빈 회의록', EmptyTasks: '빈 태스크',
    EmptyMessages: '빈 메시지', Foundations: '디자인 파운데이션',
    Mascot: '매스 스펙', MascotUsage: '매스 사용법',
  };

  let current = 'Landing';
  let processingTimer = 0;
  let state = loadState();

  function loadState() {
    try {
      return { ...structuredClone(defaultState), ...JSON.parse(localStorage.getItem(storageKey) || '{}') };
    } catch {
      return structuredClone(defaultState);
    }
  }

  function saveState() {
    localStorage.setItem(storageKey, JSON.stringify(state));
  }

  function clean(value) {
    return String(value || '').replace(/\s+/g, ' ').trim();
  }

  function safeScreen(id) {
    return screenIds.includes(id) ? id : 'Landing';
  }

  function sourceWithRuntime(id) {
    const runtimeStyle = `<style id="mm-runtime-style">
      :focus-visible { outline: 2px solid #171717 !important; outline-offset: 3px !important; }
      [aria-disabled="true"] { cursor: not-allowed !important; }
      .mm-runtime-selected { border-color: #171717 !important; background: #FAFAFA !important; }
      @media (prefers-reduced-motion: reduce) { *,*::before,*::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
    </style>`;
    return sources[id]
      .replace(/<head>/i, '<head><base href="canvas/">')
      .replace(/<\/head>/i, `${runtimeStyle}</head>`);
  }

  function navigate(id, options = {}) {
    const next = safeScreen(id);
    if (location.hash.slice(1) !== next) {
      const url = `#${next}`;
      options.replace ? history.replaceState(null, '', url) : history.pushState(null, '', url);
    }
    render(next);
  }

  function render(id) {
    clearTimeout(processingTimer);
    current = safeScreen(id);
    document.title = `${labels[current] || current} — Manager's Manager`;
    frame.title = labels[current] || current;
    frame.style.height = '760px';
    frame.srcdoc = sourceWithRuntime(current);
    window.scrollTo({ top: 0, behavior: 'instant' });
  }

  function syncHeight() {
    const doc = frame.contentDocument;
    if (!doc) return;
    frame.style.height = `${Math.max(760, doc.documentElement.scrollHeight, doc.body?.scrollHeight || 0)}px`;
  }

  function fieldKey(el, index) {
    return el.id || el.name || `${el.tagName.toLowerCase()}-${index}`;
  }

  function restoreFields(doc) {
    const saved = state.forms[current] || {};
    [...doc.querySelectorAll('input, textarea, select')].forEach((el, index) => {
      if (el.type === 'file') return;
      const value = saved[fieldKey(el, index)];
      if (value === undefined) return;
      if (el.type === 'checkbox' || el.type === 'radio') el.checked = Boolean(value);
      else el.value = value;
    });
  }

  function persistField(el) {
    if (!el.matches('input, textarea, select') || el.type === 'file') return;
    const fields = [...el.ownerDocument.querySelectorAll('input, textarea, select')];
    const key = fieldKey(el, fields.indexOf(el));
    state.forms[current] ||= {};
    state.forms[current][key] = el.type === 'checkbox' || el.type === 'radio' ? el.checked : el.value;
    saveState();
  }

  function replaceTeamName(doc) {
    if (!state.teamName || state.teamName === '캡스톤 5조') return;
    const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach((node) => {
      node.nodeValue = node.nodeValue.replaceAll('캡스톤 5조', state.teamName);
    });
  }

  function enhance(doc) {
    replaceTeamName(doc);
    restoreFields(doc);
    doc.documentElement.lang = 'ko';
    doc.addEventListener('click', handleClick);
    doc.addEventListener('submit', handleSubmit);
    doc.addEventListener('input', (event) => persistField(event.target));
    doc.addEventListener('change', (event) => persistField(event.target));
    doc.addEventListener('keydown', handleKeydown);

    doc.querySelectorAll('a[href="#"]').forEach((link) => link.setAttribute('role', 'button'));
    doc.querySelectorAll('button, a, input, select, textarea').forEach((el) => {
      if (!el.getAttribute('aria-label') && !clean(el.textContent) && el.id) el.setAttribute('aria-label', el.id);
    });

    if (current === 'Login') {
      const email = doc.querySelector('#login-email');
      const password = doc.querySelector('#login-pw');
      if (email) { email.required = true; email.autocomplete = 'email'; }
      if (password) { password.required = true; password.autocomplete = 'current-password'; }
      const forgot = [...doc.querySelectorAll('a,button')].find((el) => clean(el.textContent).includes('잊으셨나요'));
      if (forgot) forgot.setAttribute('aria-disabled', 'true');
    }

    if (current === 'Signup') {
      const name = doc.querySelector('#su-name');
      const email = doc.querySelector('#su-email');
      const password = doc.querySelector('#su-pw');
      if (name) { name.required = true; name.autocomplete = 'name'; }
      if (email) { email.required = true; email.autocomplete = 'email'; }
      if (password) { password.required = true; password.minLength = 8; password.autocomplete = 'new-password'; }
    }

    if (current === 'SetupTeam') {
      const input = doc.querySelector('#team-name');
      if (input) { input.required = true; input.maxLength = 20; }
    }

    updateSetupControls(doc);
    requestAnimationFrame(syncHeight);
    doc.fonts?.ready.then(syncHeight);

    if (current === 'Processing') {
      processingTimer = window.setTimeout(() => navigate('Meetings'), 4200);
    }
  }

  function updateSetupControls(doc) {
    if (!current.startsWith('Setup')) return;
    const next = [...doc.querySelectorAll('button')].find((el) => clean(el.textContent) === '다음');
    if (!next) return;
    const ready = current === 'SetupTeam' ? state.teamCreated
      : current === 'SetupDiscord' ? state.onboarding.discord
      : current === 'SetupNotion' ? state.onboarding.notion : true;
    next.setAttribute('aria-disabled', String(!ready));
    if (ready) {
      next.style.background = '#171717';
      next.style.color = '#FFFFFF';
    }
  }

  function handleKeydown(event) {
    if (event.altKey && event.key === '/') {
      event.preventDefault();
      openScreenPicker();
    }
    if (event.key === 'Escape') closeLayer();
  }

  function handleSubmit(event) {
    event.preventDefault();
    if (!event.target.reportValidity()) return;
    if (current === 'Login') completeLogin();
    if (current === 'Signup') completeSignup();
  }

  function clickedControl(event) {
    return event.target.closest('button, a, [role="button"], [role="link"], label');
  }

  function handleClick(event) {
    const control = clickedControl(event);
    if (!control) return;
    if (control.tagName === 'LABEL' && control.htmlFor) return;
    const text = clean(control.textContent) || clean(control.getAttribute('aria-label'));
    if (!text) return;
    if (control.matches('a[href="#"]')) event.preventDefault();

    if (control.getAttribute('aria-disabled') === 'true') {
      event.preventDefault();
      return;
    }

    if (routeShell(control, text)) return;
    if (routeScreen(control, text)) return;
    handleAction(control, text);
  }

  function routeShell(control, text) {
    if (control.closest('header')) {
      if (/^대시보드/.test(text)) return navigate('Main'), true;
      if (/^회의록/.test(text)) return navigate('Meetings'), true;
      if (/^태스크/.test(text)) return navigate('Tasks'), true;
      if (/^메시지/.test(text)) return navigate('Messages'), true;
      if (text === '팀') return navigate('Team'), true;
    }
    if (text === '리스트') return navigate('Tasks'), true;
    if (text === '보드') return navigate('TasksBoard'), true;
    if (text === '간트') return navigate('TasksGantt'), true;
    if (text === '캘린더') return navigate('TasksCalendar'), true;
    return false;
  }

  function routeScreen(control, text) {
    if (current === 'Landing') {
      if (text === 'Manager\'s Manager') return frame.contentWindow.scrollTo({ top: 0, behavior: 'smooth' }), true;
      if (text === '시작하기' || text === '무료로 시작하기') return navigate('Login'), true;
      if (['제품', '기능', '연동', '요금제', '가이드'].includes(text)) return scrollToCopy(text), true;
      if (text === '대시보드') return navigate('Main'), true;
    }
    if (current === 'Login') {
      if (text === '회원가입') return navigate('Signup'), true;
      if (text === '로그인') return completeLogin(), true;
      if (text.includes('Google 계정')) return completeLogin(), true;
      if (text.includes('잊으셨나요')) return true;
    }
    if (current === 'Signup') {
      if (text === '로그인') return navigate('Login'), true;
      if (text === '계정 만들기' || text.includes('Google 계정')) return completeSignup(), true;
    }
    if (text === '회의 올리기' || text === '텍스트로 붙여넣기') return navigate('Upload'), true;
    if (text === '태스크에서 전부 보기' || text === '확인하기' || text === '채워 넣기') return navigate('Tasks'), true;
    if (text === '메시지 초안 보기') return navigate('Messages'), true;
    if (text === '팀원 관리') return navigate('SetupMembers'), true;
    if (text === '알림 규칙 보기') return navigate('Settings'), true;
    if (text === '이미 반영된 일 보기') return navigate('Tasks'), true;
    if (text === '새 팀 만들기') return navigate('SetupTeam'), true;
    if (text === '팀 설정 · 초대') return navigate('Settings'), true;
    if (current === 'Messages' && control.tagName === 'BUTTON' && /^(재|서|지|도|#)/.test(text)) return navigate('MessagesThread'), true;
    return false;
  }

  function handleAction(control, text) {
    if (current === 'SetupTeam') return handleSetupTeam(text);
    if (current === 'SetupDiscord') return handleSetupDiscord(text);
    if (current === 'SetupNotion') return handleSetupNotion(text);
    if (current === 'SetupMembers') return handleSetupMembers(control, text);
    if (current === 'Upload') return handleUpload(text);
    if (current === 'Processing' && text === '중단하기') return navigate('Upload');

    if (text === '원문 듣기' || text === '해당 구간 들어보기') {
      return showDialog('회의 원문', '<p>선택한 발언 시점부터 음성을 재생하는 영역입니다.</p><p class="mm-muted">정적 시안에는 실제 음성 파일이 포함되어 있지 않아요.</p>');
    }
    if (text === 'Notion에서 보기' || text === 'Discord에서 열기') {
      return showDialog('외부 서비스에서 열기', '<p>실제 연동 환경에서는 연결된 외부 서비스의 해당 항목을 새 창에서 열어요.</p>');
    }
    if (text === '승인') return approve(control);
    if (text === '반려' || text === '보내지 않음') return reject(control, text);
    if (text === '이대로 발송') return confirmSend(control);
    if (text === '고쳐 쓰기') return editMessage();
    if (text === '직접 추가') return addTask();
    if (text === '날짜 넣기') return pickDate(control);
    if (text === '직접 채우기') return fillMissing(control);
    if (text === '전체 로그') return showDialog('반영 로그', '<p><span class="mm-mono">방금</span> 대시보드에서 확인했어요.</p><p><span class="mm-mono">09/10 14:20</span> 태스크를 Notion에 반영했어요.</p>');
    if (['일반', '연결', '자동 반영', '알림', '팀원', '내 계정'].includes(text)) return scrollToCopy(text);
    if (['채널 바꾸기', '속성 다시 맞추기', '연결', '바꾸기'].includes(text)) return showDialog(text, '<p>연결할 대상을 선택하는 화면입니다. 실제 목록은 API 연결 후 표시돼요.</p>');
    if (text === '연결 끊기' || text === '팀 삭제') return destructiveDialog(text);
    if (text === '문의하기' || text === '문의해 주세요') return showDialog('문의하기', '<p>문의 채널은 최종 배포 정보가 정해진 뒤 연결해요.</p>');
  }

  function completeLogin() {
    const doc = frame.contentDocument;
    const form = doc.querySelector('form');
    if (form && !form.reportValidity()) return;
    navigate(state.teamCreated ? 'Main' : 'SetupTeam');
  }

  function completeSignup() {
    const doc = frame.contentDocument;
    const form = doc.querySelector('form');
    if (form && !form.reportValidity()) return;
    navigate('SetupTeam');
  }

  function normalizeTeamName(value) {
    return String(value || '').trim().replace(/\s+/g, ' ');
  }

  function handleSetupTeam(text) {
    const doc = frame.contentDocument;
    if (text === '만들기') {
      const input = doc.querySelector('#team-name');
      const value = normalizeTeamName(input?.value);
      if (!input) return;
      input.value = value;
      input.setCustomValidity(value ? '' : '팀 이름을 입력해 주세요.');
      if (!input.reportValidity()) return;
      if (value.length > 20) {
        input.setCustomValidity('팀 이름은 20자 이하로 입력해 주세요.');
        input.reportValidity();
        return;
      }
      input.setCustomValidity('');
      state.teamName = value;
      state.teamCreated = true;
      saveState();
      showToast(`${value} 팀을 만들었어요.`);
      updateSetupControls(doc);
      return;
    }
    if (text === '다음') {
      if (!state.teamCreated) return showError('팀을 먼저 만들어 주세요.', '팀 이름을 입력하고 만들기를 눌러 주세요.');
      return navigate('SetupDiscord');
    }
  }

  function handleSetupDiscord(text) {
    if (text === '이전') return navigate('SetupTeam');
    if (text === '건너뛰기') return navigate('SetupNotion');
    if (text === '연결하기') {
      return showDialog('Discord 연결', '<p>프로토타입에서는 연결 완료 상태를 확인할 수 있어요.</p><p class="mm-muted">실제 OAuth 화면 전환 방식은 백엔드 협의 후 결정합니다.</p>', [
        { label: '취소' },
        { label: '연결 완료로 보기', primary: true, run: () => { state.onboarding.discord = true; saveState(); render(current); } },
      ]);
    }
    if (text === '다음') {
      if (!state.onboarding.discord) return incompleteSetup('Discord', 'SetupNotion');
      return navigate('SetupNotion');
    }
  }

  function handleSetupNotion(text) {
    if (text === '이전') return navigate('SetupDiscord');
    if (text === '건너뛰기') return navigate('SetupMembers');
    if (text === '바꾸기') return showDialog('Notion 보드 바꾸기', '<p>연결 가능한 데이터베이스 목록은 API 연결 후 표시돼요.</p>');
    if (text === '이 보드로 연결') {
      state.onboarding.notion = true;
      saveState();
      showToast('Notion 보드를 연결했어요.');
      updateSetupControls(frame.contentDocument);
      return;
    }
    if (text === '다음') {
      if (!state.onboarding.notion) return incompleteSetup('Notion', 'SetupMembers');
      return navigate('SetupMembers');
    }
  }

  function handleSetupMembers(control, text) {
    if (text === '이전') return navigate('SetupNotion');
    if (text === '나중에 하기' || text === '시작하기' || text.includes('확인 완료')) {
      state.onboarding.members = true;
      saveState();
      return navigate('Main');
    }
    if (text === '고르기') {
      const row = control.closest('div[style*="border-bottom"], div[style*="padding: 10px"]');
      const discordId = clean(row?.querySelector('.mono')?.textContent) || '@discord-user';
      return showPrompt('팀원 연결', `${discordId}의 실제 팀원 이름을 입력해 주세요.`, '팀원 이름', (value) => {
        const target = row?.querySelector('span[style*="justify-content: flex-end"]');
        if (target) target.innerHTML = `<span style="font-size:12.5px;font-weight:600;color:#171717">${escapeHtml(value)}</span>`;
        showToast(`${discordId}을 ${value}(으)로 연결했어요.`);
      });
    }
  }

  function incompleteSetup(name, next) {
    showDialog(`${name} 연결이 끝나지 않았어요`, '<p>연결을 계속하거나 이 단계를 건너뛸 수 있어요.</p>', [
      { label: '계속 연결하기' },
      { label: '건너뛰기', primary: true, run: () => navigate(next) },
    ]);
  }

  function handleUpload(text) {
    const doc = frame.contentDocument;
    if (text === '추가') {
      let input = doc.querySelector('#mm-file-input');
      if (!input) {
        input = doc.createElement('input');
        input.id = 'mm-file-input';
        input.type = 'file';
        input.accept = 'audio/*,.txt,.md';
        input.hidden = true;
        input.addEventListener('change', () => input.files?.[0] && showToast(`${input.files[0].name}을 추가했어요.`));
        doc.body.append(input);
      }
      return input.click();
    }
    if (text === '정리 시작하기') {
      const title = doc.querySelector('#m-title');
      if (title && !clean(title.value)) {
        title.required = true;
        return title.reportValidity();
      }
      return navigate('Processing');
    }
  }

  function approve(control) {
    showDialog('태스크 승인', '<p>확인한 내용을 Notion에 반영할까요?</p><p class="mm-muted">반영 후에도 되돌릴 수 있어요.</p>', [
      { label: '취소' },
      { label: '승인', primary: true, run: () => {
        control.textContent = '반영됨';
        control.disabled = true;
        state.decisions[Date.now()] = 'approved';
        saveState();
        showToast('태스크를 반영했어요.', { label: '되돌리기', run: () => { control.textContent = '승인'; control.disabled = false; } });
      } },
    ]);
  }

  function reject(control, label) {
    showDialog(label, `<p>${label === '반려' ? '이 태스크를 반려할까요?' : '이 메시지는 발송하지 않아요.'}</p>`, [
      { label: '취소' },
      { label, primary: true, run: () => { control.disabled = true; control.textContent = `${label}됨`; showToast(`${label} 처리했어요.`); } },
    ]);
  }

  function confirmSend(control) {
    showDialog('메시지 발송', '<p>검토한 내용으로 Discord 메시지를 발송할까요?</p><p class="mm-muted">발송한 메시지는 되돌릴 수 없어요.</p>', [
      { label: '취소' },
      { label: '이대로 발송', primary: true, run: () => { control.disabled = true; control.textContent = '발송됨'; showToast('Discord 메시지를 발송했어요.'); } },
    ]);
  }

  function editMessage() {
    showPrompt('메시지 고쳐 쓰기', '발송 전에 문구를 수정할 수 있어요.', '메시지 내용', () => showToast('메시지 초안을 수정했어요.'), true);
  }

  function addTask() {
    showPrompt('태스크 직접 추가', '회의 밖에서 생긴 태스크를 추가해요.', '태스크명', (value) => showToast(`${value} 태스크를 추가했어요.`));
  }

  function pickDate() {
    showDatePrompt('마감 정하기', (value) => showToast(`마감을 ${value}(으)로 정했어요.`));
  }

  function fillMissing() {
    showPrompt('담당자 직접 채우기', '회의에서 정해지지 않은 담당자를 입력해 주세요.', '담당자', () => showToast('담당자를 채웠어요.'));
  }

  function destructiveDialog(label) {
    showDialog(label, `<p>${label} 작업은 실제 서비스에서 백엔드 확인 후 처리합니다.</p><p class="mm-muted">이 프로토타입에서는 데이터가 변경되지 않아요.</p>`);
  }

  function scrollToCopy(text) {
    const doc = frame.contentDocument;
    const candidates = [...doc.querySelectorAll('h1,h2,h3,h4,a,button,span')];
    const target = candidates.find((el) => clean(el.textContent) === text && !el.closest('header'))
      || candidates.find((el) => clean(el.textContent).includes(text) && !el.closest('header'));
    target?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[char]);
  }

  function closeLayer() {
    layer.innerHTML = '';
    layer.hidden = true;
  }

  function showDialog(title, body, actions = [{ label: '닫기' }]) {
    layer.hidden = false;
    layer.innerHTML = `<div class="mm-scrim" data-close-layer></div><section class="mm-dialog" role="dialog" aria-modal="true" aria-labelledby="mm-dialog-title"><h2 id="mm-dialog-title">${escapeHtml(title)}</h2><div class="mm-dialog-body">${body}</div><div class="mm-dialog-actions"></div></section>`;
    const actionRoot = layer.querySelector('.mm-dialog-actions');
    actions.forEach((action) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = action.label;
      button.className = action.primary ? 'mm-button mm-primary' : 'mm-button';
      button.addEventListener('click', () => {
        const result = action.run?.();
        if (result !== false) closeLayer();
      });
      actionRoot.append(button);
    });
    layer.querySelector('[data-close-layer]').addEventListener('click', closeLayer);
    layer.querySelector('button')?.focus();
  }

  function showError(title, message) {
    showDialog(title, `<p>${escapeHtml(message)}</p>`);
  }

  function showPrompt(title, description, label, onSubmit, multiline = false) {
    const id = 'mm-prompt-input';
    showDialog(title, `<p>${escapeHtml(description)}</p><label class="mm-field" for="${id}">${escapeHtml(label)}</label>${multiline ? `<textarea id="${id}" rows="5"></textarea>` : `<input id="${id}" type="text">`}`, [
      { label: '취소' },
      { label: '저장', primary: true, run: () => {
        const input = document.querySelector(`#${id}`);
        const value = clean(input?.value);
        if (!value) { input?.focus(); return false; }
        onSubmit(value);
      } },
    ]);
    document.querySelector(`#${id}`)?.focus();
  }

  function showDatePrompt(title, onSubmit) {
    const id = 'mm-date-input';
    showDialog(title, `<label class="mm-field" for="${id}">마감일</label><input id="${id}" type="date">`, [
      { label: '취소' },
      { label: '저장', primary: true, run: () => {
        const input = document.querySelector(`#${id}`);
        const value = input?.value;
        if (!value) { input?.focus(); return false; }
        onSubmit(value);
      } },
    ]);
    document.querySelector(`#${id}`)?.focus();
  }

  function showToast(message, action) {
    document.querySelector('.mm-toast')?.remove();
    const toast = document.createElement('div');
    toast.className = 'mm-toast';
    toast.setAttribute('role', 'status');
    toast.textContent = message;
    if (action) {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = action.label;
      button.addEventListener('click', () => { action.run(); toast.remove(); });
      toast.append(button);
    }
    document.body.append(toast);
    setTimeout(() => toast.remove(), 4200);
  }

  function openScreenPicker() {
    layer.hidden = false;
    layer.innerHTML = `<div class="mm-scrim" data-close-layer></div><section class="mm-dialog mm-picker" role="dialog" aria-modal="true" aria-labelledby="mm-dialog-title"><h2 id="mm-dialog-title">화면 목록</h2><p class="mm-muted">Canvas v77 · Alt + /</p><div class="mm-screen-list"></div><div class="mm-dialog-actions"><button type="button" class="mm-button" data-close-layer>닫기</button></div></section>`;
    const list = layer.querySelector('.mm-screen-list');
    groups.forEach(([group, ids]) => {
      const heading = document.createElement('strong');
      heading.textContent = group;
      heading.className = 'mm-group-title';
      list.append(heading);
      ids.forEach((id) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `mm-screen-button${id === current ? ' is-current' : ''}`;
        button.textContent = labels[id] || id;
        button.addEventListener('click', () => { closeLayer(); navigate(id); });
        list.append(button);
      });
    });
    layer.querySelectorAll('[data-close-layer]').forEach((el) => el.addEventListener('click', closeLayer));
    layer.querySelector('.is-current')?.focus();
  }

  frame.addEventListener('load', () => enhance(frame.contentDocument));
  window.addEventListener('hashchange', () => render(safeScreen(location.hash.slice(1))));
  window.addEventListener('popstate', () => render(safeScreen(location.hash.slice(1))));
  window.addEventListener('resize', () => requestAnimationFrame(syncHeight));
  window.addEventListener('keydown', handleKeydown);
  document.addEventListener('keydown', (event) => event.key === 'Escape' && closeLayer());

  navigate(safeScreen(location.hash.slice(1) || 'Landing'), { replace: !location.hash });
})();
</script>
</body>
</html>
