<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #FFFFFF; color: #171717;
      font-family: 'NanumSquare','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
      font-size: 14px; line-height: 1.75; word-break: keep-all; -webkit-font-smoothing: antialiased; }
    a { color: #171717; text-decoration: none; }
    a:hover { color: #5A5A5A; }
    button { font: inherit; color: inherit; cursor: pointer; }
    input { font: inherit; color: inherit; }
    .mono { font-family: 'NanumSquare','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; font-variant-numeric: tabular-nums; letter-spacing: 0; }
    .dsp { font-family: 'NanumSquare','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; }
    ::selection { background: #171717; color: #FFFFFF; }
    :focus-visible { outline: 2px solid #171717; outline-offset: 4px; }
    h1 { font-weight: 700; line-height: 1.4; letter-spacing: -0.045em; }
    h2, h3 { font-weight: 700; line-height: 1.55; letter-spacing: -0.025em; }
    p { line-height: 1.85; }
  
    .modal-trigger { display: inline-flex; align-items: center; justify-content: center; border: 0; background: transparent; cursor: pointer; transition: background-color .15s ease; }
    .modal-trigger:hover { background: #EDEDED; }
    .modal-trigger svg { transition: stroke .15s ease; }
    .modal-trigger:hover svg { stroke: #171717; }
    .modal-check { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .modal-overlay { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; padding: 24px; z-index: 100; }
    .modal-scrim { position: absolute; inset: 0; background: rgba(23, 23, 23, 0.32); cursor: pointer; }
    .modal-card { position: relative; width: 380px; max-width: 100%; padding: 24px; border: 1px solid #E8E8E8; border-radius: 16px; background: #FFFFFF; display: flex; flex-direction: column; gap: 12px; }
    .modal-card h3 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.02em; color: #171717; }
    .modal-card p { margin: 0; font-size: 13.5px; line-height: 1.7; color: #5A5A5A; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; padding-top: 6px; }
    .modal-cancel { display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 9px; font-size: 13px; font-weight: 600; color: #5A5A5A; background: transparent; cursor: pointer; }
    .modal-cancel:hover { background: #EDEDED; }
    .modal-confirm { height: 36px; padding: 0 16px; border: 0; border-radius: 9px; font-size: 13px; font-weight: 600; color: #FFFFFF; background: #171717; cursor: pointer; }
  body:has(#undo-tasks-1:checked) #modal-undo-tasks-1 { display: flex; }
    body:has(#undo-tasks-2:checked) #modal-undo-tasks-2 { display: flex; }
    body:has(#undo-tasks-3:checked) #modal-undo-tasks-3 { display: flex; }
  </style>
</helmet>
